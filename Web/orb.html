<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Glance orb</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* The orb alone, centred in its small window; the window leaves room around it for the glow and ripples. */
    .orb.floating { top: calc(50% - 23px); left: calc(50% - 23px); width: 46px; height: 46px; transition: none; }
    /* The design's floating orb (v11, VS Code "orb"): a drop shadow and a coral rim. */
    .orb.floating .core { box-shadow: inset 0 -6px 18px #0003, 0 4px 12px #0008, 0 0 0 4px #e8643c44; }
    /* While the popover is open the orb rests: its glow dims a little. */
    .orb.floating.open .glow { opacity: .7; }
    /* A meeting is due (meeting nudges): a slow coral pulse and a clock mark, so colour isn't the only signal. */
    .orb .clock { position: absolute; inset: 24%; width: 52%; height: 52%; fill: none; stroke: #fff; stroke-width: 2.4;
      stroke-linecap: round; stroke-linejoin: round; opacity: 0; transition: opacity .3s; z-index: 3; }
    .orb[data-mode=meeting] { --glow: #e8643caa; }
    .orb[data-mode=meeting] .glow { animation: breathe 2s ease-in-out infinite; }
    .orb[data-mode=meeting] .core { animation: none; }
    .orb[data-mode=meeting] .ripple { animation: ripple 2s ease-out infinite; }
    .orb[data-mode=meeting] .clock { opacity: .95; }
    /* The orb channel (spec 2026-10-09-orb-channel-design.md, "The orb"): a session needs you (coral, quick), fn is
       held (white ripples), a session finished (green) or failed (red). Each has a motion, not only a colour. */
    .orb[data-mode=waiting] { --glow: #e8643ccc; }
    .orb[data-mode=waiting] .glow { animation: breathe 1.2s ease-in-out infinite; }
    .orb[data-mode=waiting] .ripple { animation: ripple 1.2s ease-out infinite; }
    .orb[data-mode=listening] { --glow: #ffffffb0; }
    .orb[data-mode=listening] .ripple { animation: ripple .8s ease-out infinite; }
    .orb[data-mode=listening] .core { animation: fastb .8s ease-in-out infinite; }
    .orb[data-mode=done] { --glow: #2ea043aa; }
    .orb[data-mode=done] .glow { animation: breathe 1.5s ease-in-out 2; }
    .orb[data-mode=error] { --glow: #d9402faa; }
    .orb[data-mode=error] .glow { animation: fastb .5s ease-in-out 3; }
    @media (prefers-reduced-motion: reduce) {
      .orb[data-mode] .glow, .orb[data-mode] .ripple, .orb[data-mode] .core { animation: none; }
    }
  </style>
</head>
<body>
  <div class="orb floating" id="orb" data-mode="idle">
    <div class="glow"></div>
    <div class="ripple"></div>
    <div class="ripple late"></div>
    <div class="think"><span></span><span></span><span></span></div>
    <div class="read-ring"></div>
    <div class="body" id="orb-body">
      <div class="core">
        <div class="layer idle"></div>
        <div class="layer thinking"></div>
        <div class="layer reading"></div>
        <div class="scan"></div>
        <div class="shine"></div>
      </div>
      <svg class="clock" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    </div>
  </div>
  <script src="orb.js"></script>
</body>
</html>
