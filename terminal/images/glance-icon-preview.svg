<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1024" viewBox="0 0 2048 1024">
  <!-- Glance Studio app icon: the master drawing, flattened onto the classic 824px macOS tile, light (left) and
       dark (right). The mark is assets/logo/glance-mark.svg: the coral orb inside its coral-and-amber level ring.
       The shipping icon is the Icon Composer bundle Glance.icon, whose layers are this same art on a full-bleed
       1024 canvas (Orb.svg, Ticks.svg / Ticks-Dark.svg, Glow.svg on dark only; the tile is icon.json's fill);
       the system adds the Liquid Glass on top. -->
  <defs><clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath></defs>
  <g transform="translate(0 0)">
    <defs><linearGradient id="groundLight" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FAF8F3"/><stop offset="1" stop-color="#ECE7DC"/></linearGradient></defs>
    <g clip-path="url(#tile)">
      <g transform="translate(100 100) scale(0.8046875)">
        <rect width="1024" height="1024" fill="url(#groundLight)"/>
        
        <g transform="translate(174.08 174.08) scale(3.3792)"><g stroke="#E05A30" stroke-width="5" stroke-linecap="round"><line x1="100" y1="38" x2="100" y2="28" transform="rotate(0 100 100)"/><line x1="100" y1="38" x2="100" y2="24" transform="rotate(15 100 100)"/><line x1="100" y1="38" x2="100" y2="18" transform="rotate(30 100 100)"/><line x1="100" y1="38" x2="100" y2="20" transform="rotate(60 100 100)"/><line x1="100" y1="38" x2="100" y2="26" transform="rotate(75 100 100)"/><line x1="100" y1="38" x2="100" y2="22" transform="rotate(90 100 100)"/><line x1="100" y1="38" x2="100" y2="14" transform="rotate(105 100 100)"/><line x1="100" y1="38" x2="100" y2="16" transform="rotate(135 100 100)"/><line x1="100" y1="38" x2="100" y2="24" transform="rotate(150 100 100)"/><line x1="100" y1="38" x2="100" y2="28" transform="rotate(165 100 100)"/><line x1="100" y1="38" x2="100" y2="26" transform="rotate(180 100 100)"/><line x1="100" y1="38" x2="100" y2="22" transform="rotate(255 100 100)"/><line x1="100" y1="38" x2="100" y2="14" transform="rotate(270 100 100)"/><line x1="100" y1="38" x2="100" y2="22" transform="rotate(285 100 100)"/><line x1="100" y1="38" x2="100" y2="26" transform="rotate(300 100 100)"/><line x1="100" y1="38" x2="100" y2="18" transform="rotate(330 100 100)"/><line x1="100" y1="38" x2="100" y2="14" transform="rotate(345 100 100)"/></g><g stroke="#C48A24" stroke-width="5" stroke-linecap="round"><line x1="100" y1="38" x2="100" y2="12" transform="rotate(45 100 100)"/><line x1="100" y1="38" x2="100" y2="8" transform="rotate(120 100 100)"/><line x1="100" y1="38" x2="100" y2="6" transform="rotate(195 100 100)"/><line x1="100" y1="38" x2="100" y2="14" transform="rotate(210 100 100)"/><line x1="100" y1="38" x2="100" y2="12" transform="rotate(225 100 100)"/><line x1="100" y1="38" x2="100" y2="12" transform="rotate(240 100 100)"/><line x1="100" y1="38" x2="100" y2="12" transform="rotate(315 100 100)"/></g></g>
        <defs><radialGradient id="orb" cx="0.36" cy="0.3" r="0.85"><stop offset="0" stop-color="#FFB08F"/><stop offset="0.55" stop-color="#E8643C"/><stop offset="1" stop-color="#B93A18"/></radialGradient></defs><g transform="translate(174.08 174.08) scale(3.3792)"><circle cx="109" cy="93" r="36" fill="url(#orb)"/><circle cx="121" cy="79" r="7" fill="#FFFFFF" opacity="0.9"/></g>
      </g>
    </g>
    <rect x="100.5" y="100.5" width="823" height="823" rx="185" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2"/>
  </g>
  <g transform="translate(1024 0)">
    <defs><linearGradient id="groundDark" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#26231F"/><stop offset="1" stop-color="#161412"/></linearGradient></defs>
    <g clip-path="url(#tile)">
      <g transform="translate(100 100) scale(0.8046875)">
        <rect width="1024" height="1024" fill="url(#groundDark)"/>
        <g style="mix-blend-mode: plus-lighter"><defs><filter id="halo" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><feGaussianBlur stdDeviation="60"/></filter></defs><g filter="url(#halo)"><g transform="translate(174.08 174.08) scale(3.3792)"><circle cx="109" cy="93" r="40" fill="#E8643C" opacity="0.55"/></g></g></g>
        <g transform="translate(174.08 174.08) scale(3.3792)"><g stroke="#E8643C" stroke-width="5" stroke-linecap="round"><line x1="100" y1="38" x2="100" y2="28" transform="rotate(0 100 100)"/><line x1="100" y1="38" x2="100" y2="24" transform="rotate(15 100 100)"/><line x1="100" y1="38" x2="100" y2="18" transform="rotate(30 100 100)"/><line x1="100" y1="38" x2="100" y2="20" transform="rotate(60 100 100)"/><line x1="100" y1="38" x2="100" y2="26" transform="rotate(75 100 100)"/><line x1="100" y1="38" x2="100" y2="22" transform="rotate(90 100 100)"/><line x1="100" y1="38" x2="100" y2="14" transform="rotate(105 100 100)"/><line x1="100" y1="38" x2="100" y2="16" transform="rotate(135 100 100)"/><line x1="100" y1="38" x2="100" y2="24" transform="rotate(150 100 100)"/><line x1="100" y1="38" x2="100" y2="28" transform="rotate(165 100 100)"/><line x1="100" y1="38" x2="100" y2="26" transform="rotate(180 100 100)"/><line x1="100" y1="38" x2="100" y2="22" transform="rotate(255 100 100)"/><line x1="100" y1="38" x2="100" y2="14" transform="rotate(270 100 100)"/><line x1="100" y1="38" x2="100" y2="22" transform="rotate(285 100 100)"/><line x1="100" y1="38" x2="100" y2="26" transform="rotate(300 100 100)"/><line x1="100" y1="38" x2="100" y2="18" transform="rotate(330 100 100)"/><line x1="100" y1="38" x2="100" y2="14" transform="rotate(345 100 100)"/></g><g stroke="#D9A441" stroke-width="5" stroke-linecap="round"><line x1="100" y1="38" x2="100" y2="12" transform="rotate(45 100 100)"/><line x1="100" y1="38" x2="100" y2="8" transform="rotate(120 100 100)"/><line x1="100" y1="38" x2="100" y2="6" transform="rotate(195 100 100)"/><line x1="100" y1="38" x2="100" y2="14" transform="rotate(210 100 100)"/><line x1="100" y1="38" x2="100" y2="12" transform="rotate(225 100 100)"/><line x1="100" y1="38" x2="100" y2="12" transform="rotate(240 100 100)"/><line x1="100" y1="38" x2="100" y2="12" transform="rotate(315 100 100)"/></g></g>
        <defs><radialGradient id="orb" cx="0.36" cy="0.3" r="0.85"><stop offset="0" stop-color="#FFB08F"/><stop offset="0.55" stop-color="#E8643C"/><stop offset="1" stop-color="#B93A18"/></radialGradient></defs><g transform="translate(174.08 174.08) scale(3.3792)"><circle cx="109" cy="93" r="36" fill="url(#orb)"/><circle cx="121" cy="79" r="7" fill="#FFFFFF" opacity="0.9"/></g>
      </g>
    </g>
    <rect x="100.5" y="100.5" width="823" height="823" rx="185" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2"/>
  </g>
</svg>
