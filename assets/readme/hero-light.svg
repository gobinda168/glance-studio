      <g transform="rotate(105.0)"><line class="ray" x1="0" y1="-66" x2="0" y2="-88" stroke="#d9a441" style="animation-delay:0.24s;animation-duration:0.98s"/></g>
      <g transform="rotate(120.0)"><line class="ray" x1="0" y1="-66" x2="0" y2="-80" stroke="#e8643c" style="animation-delay:0.31s;animation-duration:1.1s"/></g>
