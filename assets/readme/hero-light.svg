      <g transform="rotate(270.0)"><line class="ray" x1="0" y1="-66" x2="0" y2="-96" stroke="#e8643c" style="animation-delay:0.52s;animation-duration:1.3s"/></g>
      <g transform="rotate(285.0)"><line class="ray" x1="0" y1="-66" x2="0" y2="-84" stroke="#e8643c" style="animation-delay:0.97s;animation-duration:1.26s"/></g>
      <g transform="rotate(300.0)"><line class="ray" x1="0" y1="-66" x2="0" y2="-96" stroke="#e8643c" style="animation-delay:0.92s;animation-duration:1.42s"/></g>
      <g transform="rotate(315.0)"><line class="ray" x1="0" y1="-66" x2="0" y2="-92" stroke="#e8643c" style="animation-delay:1.26s;animation-duration:1.45s"/></g>
      <g transform="rotate(330.0)"><line class="ray" x1="0" y1="-66" x2="0" y2="-100" stroke="#d9a441" style="animation-delay:1.12s;animation-duration:1.17s"/></g>
