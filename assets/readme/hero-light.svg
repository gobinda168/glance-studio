    <text class="fade" x="470" y="140" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-2.5" fill="#1c1a17">Glance Studio</text>
    <text x="472" y="196" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="600" letter-spacing="-0.5" fill="#c4471f"><tspan class="ch" style="animation-delay:0.900s">Y</tspan><tspan class="ch" style="animation-delay:0.945s">o</tspan><tspan class="ch" style="animation-delay:0.990s">u</tspan><tspan class="ch" style="animation-delay:1.035s">&#160;</tspan><tspan class="ch" style="animation-delay:1.080s">d</tspan><tspan class="ch" style="animation-delay:1.125s">i</tspan><tspan class="ch" style="animation-delay:1.170s">r</tspan><tspan class="ch" style="animation-delay:1.215s">e</tspan><tspan class="ch" style="animation-delay:1.260s">c</tspan><tspan class="ch" style="animation-delay:1.305s">t</tspan><tspan class="ch" style="animation-delay:1.350s">.</tspan><tspan class="ch" style="animation-delay:1.395s">&#160;</tspan><tspan class="ch" style="animation-delay:1.440s">T</tspan><tspan class="ch" style="animation-delay:1.485s">h</tspan><tspan class="ch" style="animation-delay:1.530s">e</tspan><tspan class="ch" style="animation-delay:1.575s">&#160;</tspan><tspan class="ch" style="animation-delay:1.620s">a</tspan><tspan class="ch" style="animation-delay:1.665s">g</tspan><tspan class="ch" style="animation-delay:1.710s">e</tspan><tspan class="ch" style="animation-delay:1.755s">n</tspan><tspan class="ch" style="animation-delay:1.800s">t</tspan><tspan class="ch" style="animation-delay:1.845s">s</tspan><tspan class="ch" style="animation-delay:1.890s">&#160;</tspan><tspan class="ch" style="animation-delay:1.935s">b</tspan><tspan class="ch" style="animation-delay:1.980s">u</tspan><tspan class="ch" style="animation-delay:2.025s">i</tspan><tspan class="ch" style="animation-delay:2.070s">l</tspan><tspan class="ch" style="animation-delay:2.115s">d</tspan><tspan class="ch" style="animation-delay:2.160s">.</tspan><tspan class="caret" style="animation-delay:2.21s" fill="#c4471f">▍</tspan></text>
