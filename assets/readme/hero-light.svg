<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img"
     aria-label="Glance Studio. You direct. The agents build.">
  <title>Glance Studio — You direct. The agents build.</title>
  <defs>
    <radialGradient id="orb" cx="0.36" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#ffb08f"/><stop offset="0.55" stop-color="#e8643c"/><stop offset="1" stop-color="#b93a18"/>
    </radialGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#e8643c" stop-opacity="0.55"/><stop offset="1" stop-color="#e8643c" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowA"><stop offset="0" stop-color="#e8643c" stop-opacity="0.18"/><stop offset="1" stop-color="#e8643c" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB"><stop offset="0" stop-color="#c96df2" stop-opacity="0.18"/><stop offset="1" stop-color="#c96df2" stop-opacity="0"/></radialGradient>
    <clipPath id="frame"><rect width="1280" height="360" rx="24"/></clipPath>
  </defs>
  <style>
    .drift-a { animation: driftA 14s ease-in-out infinite alternate; }
    .drift-b { animation: driftB 18s ease-in-out infinite alternate; }
    .breathe { transform-box: fill-box; transform-origin: center; animation: breathe 3.2s ease-in-out infinite; }
    .halo { transform-box: fill-box; transform-origin: center; animation: halo 3.2s ease-in-out infinite; }
    .ray { stroke-width: 5; stroke-linecap: round; transform-box: fill-box; transform-origin: 50% 100%;
            animation-name: speak; animation-iteration-count: infinite; animation-direction: alternate;
            animation-timing-function: ease-in-out; }
    .ch { opacity: 0; animation: type 0.01s linear forwards; }
    .caret { opacity: 0; animation: blink 1s steps(1) infinite; }
    .chip { opacity: 0; animation: rise 0.6s cubic-bezier(.2,.8,.2,1) forwards; }
    .fade { opacity: 0; animation: rise 0.8s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes driftA { from { transform: translate(0,0); } to { transform: translate(120px, 40px); } }
    @keyframes driftB { from { transform: translate(0,0); } to { transform: translate(-140px, -30px); } }
    @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.045); } }
    @keyframes halo { 0%,100% { transform: scale(0.92); opacity: .55; } 50% { transform: scale(1.12); opacity: .9; } }
    @keyframes speak { from { transform: scaleY(0.35); } to { transform: scaleY(1.25); } }
    @keyframes type { to { opacity: 1; } }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) {
      .drift-a, .drift-b, .breathe, .halo, .ray { animation: none; }
      .ch, .chip, .fade { animation: none; opacity: 1; }
      .caret { animation: none; opacity: 1; }
    }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1280" height="360" fill="#f4f1ea"/>
    <ellipse class="drift-a" cx="260" cy="140" rx="420" ry="260" fill="url(#glowA)"/>
    <ellipse class="drift-b" cx="1060" cy="260" rx="460" ry="240" fill="url(#glowB)"/>
    <g transform="translate(250 180)">
