      <g transform="rotate(210.0)"><line class="ray" x1="0" y1="-66" x2="0" y2="-92" stroke="#e8643c" style="animation-delay:1.34s;animation-duration:1.01s"/></g>
      <g transform="rotate(225.0)"><line class="ray" x1="0" y1="-66" x2="0" y2="-84" stroke="#e8643c" style="animation-delay:0.21s;animation-duration:1.36s"/></g>
