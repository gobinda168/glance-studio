      <g transform="rotate(0.0)"><line class="ray" x1="0" y1="-66" x2="0" y2="-88" stroke="#e8643c" style="animation-delay:0.48s;animation-duration:1.15s"/></g>
      <g transform="rotate(15.0)"><line class="ray" x1="0" y1="-66" x2="0" y2="-92" stroke="#e8643c" style="animation-delay:0.81s;animation-duration:1.22s"/></g>
